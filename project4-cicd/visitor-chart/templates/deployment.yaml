apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-visitor
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: visitor
  template:
    metadata:
      labels:
        app: visitor
    spec:
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 3000
        env:
        - name: REDIS_URL
          value: "redis://{{ .Release.Name }}-redis:{{ .Values.redis.port }}"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000